<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tetris</title>
<style>
  body {margin:0; display:flex; justify-content:center; align-items:center; height:100vh;background:#222;color:#fff;font-family:sans-serif;}
  canvas{background:#000;border:2px solid #555;}
</style>
</head>
<body>
<canvas id="game" width="200" height="400"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const ROWS=20, COLS=10;
const BLOCK_SIZE=20;
let board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
// Tetromino shapes
const SHAPES=[[[1,1],[1,1]], // O
              [[0,1,0],[1,1,1]], // T
              [[1,0,0],[1,1,1]], // J
              [[0,0,1],[1,1,1]], // L
              [[1,1],[1,1],],// O duplicate? ignore
              [[1,1,0],[0,1,1]], // S
              [[0,1,1],[1,1,0]]];
let current=null;
function spawnPiece(){current={shape:SHAPES[Math.floor(Math.random()*SHAPES.length)],x:3,y:0};if(collide(current.shape,current.x,current.y)){alert('Game Over');location.reload();}}
spawnPiece();
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(board[r][c]){ctx.fillStyle='#'+((r*COLS+c)%2?'FF5555':'55FF55');ctx.fillRect(c*BLOCK_SIZE,r*BLOCK_SIZE,BLOCK_SIZE,BLOCK_SIZE);}}
  // draw current
  ctx.fillStyle='yellow';
  for(let i=0;i<current.shape.length;i++)for(let j=0;j<current.shape[i].length;j++){if(current.shape[i][j]){ctx.fillRect((current.x+j)*BLOCK_SIZE,(current.y+i)*BLOCK_SIZE,BLOCK_SIZE,BLOCK_SIZE);}}
}
draw();
function collide(shape, offsetX, offsetY){for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++){if(shape[y][x]){const nx=x+offsetX;const ny=y+offsetY;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&board[ny][nx])return true;}}return false;}\nfunction lock(){for(let y=0;y<current.shape.length;y++)for(let x=0;x<current.shape[y].length;x++){if(current.shape[y][x] && current.y+y>=0){board[current.y+y][current.x+x]=1;}}clearLines();spawnPiece();}\nfunction clearLines(){for(let y=ROWS-1;y>=0;y--){let full=true;for(let x=0;x<COLS;x++){if(!board[y][x]){full=false;break;}}if(full){board.splice(y,1);board.unshift(Array(COLS).fill(0));y++;}}\nfunction spawnPiece(){current={shape:SHAPES[Math.floor(Math.random()*SHAPES.length)],x:3,y:0};if(collide(current.shape,current.x,current.y)){alert('Game Over');location.reload();}}\nlet dropInterval=500;let lastTime=0;function update(time){const delta=time-lastTime;if(delta>dropInterval){if(!collide(current.shape,current.x,current.y+1))current.y++;else lock();lastTime=time;}draw();requestAnimationFrame(update);}requestAnimationFrame(update);\ndocument.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){if(!collide(current.shape,current.x-1,current.y))current.x--;draw();}else if(e.key==='ArrowRight'){if(!collide(current.shape,current.x+1,current.y))current.x++;draw();}else if(e.key==='ArrowDown'){if(!collide(current.shape,current.x,current.y+1))current.y++;else lock();draw();}else if(e.key==='ArrowUp'){// rotate 90deg
const rotated=current.shape[0].map((_,i)=>current.shape.map(row=>row[i]).reverse());if(!collide(rotated,current.x,current.y)){current.shape=rotated;}}
});
</script>
</body>
</html>
